---
bmc:
  basePath: /redfish/v1/
  metrics:
    ThermalMetrics:
      chassis: ["Chassis*", "HGX_CPU_*", "HGX_GPU_*"]
      path: "{chassis}/ThermalSubsystem/ThermalMetrics"
    Voltage:
      pdb: ["PDB_*"]
      reading: ["*Volt_In*", "*Volt_Out*", "*Voltage*"]
      gpu: ["HGX_GPU_*"]
      path: ["Chassis/{pdb}/Sensors", "Chassis/{gpu}"]
  events:
    LeakDetector:
      leakdetector: ["*LeakDetector*"]
      path: Chassis_0/Sensors/{leakdetector}
    EventLog:
      path: Systems/System_0/LogServices/EventLog/Entries
